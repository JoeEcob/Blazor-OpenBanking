info:
  name: Get Account By ID
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/accounts/{{accountId}}"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Accept
      value: application/json

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
