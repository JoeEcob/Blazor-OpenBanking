info:
  name: Get Pending Transactions
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/accounts/{{accountId}}/transactions/pending"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Accept
      value: application/json

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
