info:
  name: Get Balance
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/accounts/{{accountId}}/balance"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Accept
      value: application/json

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
