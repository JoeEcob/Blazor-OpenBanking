info:
  name: Exchange Auth Code
  type: http
  seq: 1

http:
  method: POST
  url: https://auth.truelayer.com/connect/token

  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded

  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: authorization_code

      - name: client_id
        value: "{{clientId}}"

      - name: client_secret
        value: "{{clientSecret}}"

      - name: redirect_uri
        value: "{{redirectUri}}"

      - name: code
        value: "{{authCode}}"
