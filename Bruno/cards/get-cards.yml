info:
  name: Get Cards
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/cards"

  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"

    - name: Accept
      value: application/json

runtime:
  scripts:
    - type: after-response
      code: |
        const body = res.getBody();

        // Optional: store first card id for convenience
        if (body.results?.length) {
          bru.setEnvVar("cardId", body.results[0].account_id);
        }
